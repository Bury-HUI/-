<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B3D36" />
  <title>余额 · 个人账户台账</title>
  <link rel="stylesheet" href="app.css?v=30" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-title">余额台账</p>
            <p class="brand-sub" id="syncLine">加载中…</p>
          </div>
        </div>
        <div class="hero-actions">
          <button class="icon-btn" id="btnRefresh" title="刷新" aria-label="刷新">⟳</button>
        </div>
      </div>

      <section class="total-card">
        <p class="total-label">全部资产 <span id="latestDate"></span></p>
        <p class="total-value" id="totalValue">¥ --</p>
        <div class="total-meta">
          <div class="meta-chip">
            <span>近7日消费</span>
            <strong id="weekSpend">¥ --</strong>
          </div>
          <div class="meta-chip">
            <span>已记账</span>
            <strong id="filledCount">--</strong>
          </div>
        </div>
      </section>

      <section class="accounts" id="accountGrid" aria-label="账户余额"></section>
    </header>

    <main class="main">
      <div class="toolbar">
        <h2 class="section-title">每日明细</h2>
        <div class="filters">
          <input type="search" id="searchInput" placeholder="搜索日期，如 9.24" autocomplete="off" />
        </div>
      </div>

      <div class="day-list" id="dayList"></div>
      <div class="table-wrap" id="tableWrap">
        <table class="ledger" id="ledger">
          <thead><tr id="ledgerHead"></tr></thead>
          <tbody id="ledgerBody"></tbody>
        </table>
      </div>
      <p class="empty-hint" id="emptyHint" hidden>没有匹配的记录</p>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js?v=30"></script>
</body>
</html>
