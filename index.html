<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B3D36" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>余额 · 个人账户台账</title>
  <link rel="stylesheet" href="app.css?v=20" />
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <div class="app">
    <header class="hero">
      <div class="hero-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-title">余额台账</p>
            <p class="brand-sub" id="syncLine">连接中…</p>
          </div>
        </div>
        <div class="hero-actions">
          <button class="icon-btn" id="btnRefresh" title="刷新" aria-label="刷新">⟳</button>
          <button class="icon-btn" id="btnSyncInfo" title="访问地址" aria-label="访问地址">⌖</button>
        </div>
      </div>

      <section class="total-card" id="totalCard">
        <p class="total-label">全部资产 <span id="latestDate"></span></p>
        <p class="total-value" id="totalValue">¥ --</p>
        <div class="total-meta">
          <div class="meta-chip">
            <span>近7日消费</span>
            <strong id="weekSpend">¥ --</strong>
          </div>
          <div class="meta-chip">
            <span>已记账</span>
            <strong id="filledCount">--</strong>
          </div>
        </div>
      </section>

      <section class="accounts" id="accountGrid" aria-label="账户余额"></section>
    </header>

    <main class="main">
      <div class="toolbar">
        <h2 class="section-title">每日明细</h2>
        <div class="filters">
          <input type="search" id="searchInput" placeholder="搜索日期，如 9.24" autocomplete="off" />
        </div>
      </div>

      <div class="day-list" id="dayList" aria-label="每日明细卡片"></div>
      <div class="table-wrap" id="tableWrap">
        <table class="ledger" id="ledger">
          <thead>
            <tr id="ledgerHead"></tr>
          </thead>
          <tbody id="ledgerBody"></tbody>
        </table>
      </div>
      <p class="empty-hint" id="emptyHint" hidden>没有匹配的记录</p>
    </main>

    <button class="fab" id="btnAdd" aria-label="记一笔">＋</button>
  </div>

  <!-- 编辑抽屉 -->
  <div class="drawer-root" id="editDrawer" hidden>
    <div class="drawer-mask" data-close></div>
    <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <header class="drawer-head">
        <h3 id="editTitle">记一笔</h3>
        <button class="icon-btn" data-close aria-label="关闭">×</button>
      </header>
      <form id="editForm" class="drawer-body">
        <label class="field">
          <span>日期</span>
          <input name="date" required placeholder="例如 9.25 或 12.31" />
        </label>
        <div class="field-grid" id="accountFields"></div>
        <p class="drawer-tip">「全部」「消费」由公式自动计算，无需手填。</p>
        <div class="drawer-actions">
          <button type="button" class="btn ghost" data-close>取消</button>
          <button type="submit" class="btn primary" id="btnSave">保存到表格</button>
        </div>
      </form>
    </section>
  </div>

  <!-- 访问说明 -->
  <div class="drawer-root" id="infoDrawer" hidden>
    <div class="drawer-mask" data-close></div>
    <section class="drawer" role="dialog" aria-modal="true">
      <header class="drawer-head">
        <h3>手机访问</h3>
        <button class="icon-btn" data-close aria-label="关闭">×</button>
      </header>
      <div class="drawer-body">
        <p class="info-text">登录后可任意网络访问。电脑保持开机与服务运行，数据与桌面《余额.xlsx》实时双向同步。</p>
        <div class="url-list" id="urlList"></div>
        <p class="drawer-tip">公网地址经隧道转发；请勿把账号密码告诉他人。</p>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- 登录 -->
  <div class="login-root" id="loginRoot" hidden>
    <section class="login-card">
      <div class="brand-mark" aria-hidden="true"></div>
      <h2>余额台账</h2>
      <p class="login-sub">登录后可在任意网络查看与记账</p>
      <form id="loginForm">
        <label class="field">
          <span>账号</span>
          <input name="user" autocomplete="username" required placeholder="" />
        </label>
        <label class="field">
          <span>密码</span>
          <input name="password" type="password" autocomplete="current-password" required placeholder="" />
        </label>
        <button type="submit" class="btn primary" id="btnLogin">登录</button>
      </form>
      <p class="drawer-tip" id="loginHint"></p>
    </section>
  </div>

  <script src="app.js?v=20"></script>
</body>
</html>
